name: Build Executables

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: mdconvert-app-linux
          - os: windows-latest
            asset_name: mdconvert-app-windows.exe
          - os: macos-latest
            asset_name: mdconvert-app-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -e ".[build]"

      - name: Construire l'exécutable
        shell: bash
        run: |
          SEP=":"
          if [ "${{ runner.os }}" = "Windows" ]; then SEP=";"; fi
          pyinstaller --noconfirm --onefile --name mdconvert-app \
            --add-data "md_converter/webapp/templates${SEP}md_converter/webapp/templates" \
            --add-data "md_converter/webapp/static${SEP}md_converter/webapp/static" \
            run_desktop.py

      - name: Préparer l'artefact
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/mdconvert-app.exe "out/${{ matrix.asset_name }}"
          else
            cp dist/mdconvert-app "out/${{ matrix.asset_name }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: out/${{ matrix.asset_name }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publier la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
