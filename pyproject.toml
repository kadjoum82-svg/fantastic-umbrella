[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "md-converter"
version = "0.1.0"
description = "Convertisseur multi-format (PDF, Word, EPUB, images, pages web) vers Markdown, sans limite de pages."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "readability-lxml>=0.8.1",
    "lxml>=5.0",
    "requests>=2.31",
    "Pillow>=10.0",
    "pytesseract>=0.3.10",
    "markitdown>=0.1.0",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
mdconvert = "md_converter.cli:main"
mdconvert-app = "md_converter.desktop:main"

[tool.setuptools.packages.find]
include = ["md_converter*"]

[tool.setuptools.package-data]
md_converter = ["webapp/templates/*", "webapp/static/*"]
